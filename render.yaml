services:
  - type: web
    name: drishtivani-diagram-engine
    runtime: docker
    dockerfilePath: ./diagram_engine/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health

  - type: web
    name: drishtivani-ingestion
    runtime: docker
    dockerfilePath: ./ingestion-service/Dockerfile
    dockerContext: ./ingestion-service
    plan: free
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: SKIP_STARTUP_CHECKS
        value: "true"
      - key: USE_LOCAL_STORAGE
        value: "true"
      - key: DATABASE_URL
        value: "sqlite:///./drishtivani_local.db"
      - key: DIAGRAM_ENGINE_URL
        value: "https://drishtivani-diagram-engine.onrender.com"

  - type: web
    name: drishtivani-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: free
    envVars:
      - key: NEXT_PUBLIC_DEMO_MODE
        value: "false"
      - key: NEXT_PUBLIC_API_URL
        value: "https://drishtivani-ingestion.onrender.com"
      - key: NEXT_PUBLIC_DIAGRAM_API_URL
        value: "https://drishtivani-diagram-engine.onrender.com"
